[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llms-txt-snapshots"
version = "0.2.0"
description = "Robots-aware snapshots of public llms.txt discovery signals"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "levvs-one" }]
dependencies = [
  "protego==0.6.2",
  "requests==2.34.2",
  "urllib3==2.7.0",
]

[project.urls]
Repository = "https://github.com/levvs-one/llms-txt-snapshots"
Issues = "https://github.com/levvs-one/llms-txt-snapshots/issues"

[project.scripts]
llms-txt-snapshots = "llms_txt_snapshots.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
